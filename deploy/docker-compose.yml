# 墨坊 InkStudio — Rocky Linux 一键部署
# 用法：cd deploy && ./start.sh

services:
  mongo:
    image: mongo:7
    container_name: inkstudio-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  mongo-express:
    image: mongo-express:latest
    container_name: inkstudio-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-changeme}
    depends_on:
      - mongo

  api:
    image: node:20.19.5-alpine
    container_name: inkstudio-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../server:/app
      - ../server/uploads:/app/uploads
    env_file:
      - .env
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/slate-mern-app
    command: sh -c "npm install && npm run build && node dist/index.js"
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  web:
    image: nginx:alpine
    container_name: inkstudio-web
    restart: unless-stopped
    volumes:
      - ../client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
